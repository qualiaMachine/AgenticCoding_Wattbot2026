[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wattbot"
version = "0.1.0"
description = "Reproducible baseline RAG pipeline for WattBot 2026"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "openai>=1.0",
    "pypdf>=5.0",
    "python-dotenv>=1.0",
]

[project.scripts]
wattbot = "wattbot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

